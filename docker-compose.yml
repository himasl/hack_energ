services:
  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.11-slim}
    ports:
      - "8000:8000"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-https://ollama.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-changeme}
      LLM_MODEL: ${LLM_MODEL:-gpt-oss:120b}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      LLM_MAX_REPAIRS: ${LLM_MAX_REPAIRS:-2}
